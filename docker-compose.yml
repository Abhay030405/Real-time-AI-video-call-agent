# Local running only. Production uses LiveKit Cloud (Mumbai) for the agent
# and managed PostgreSQL and Redis hosted in India.
#
# Start everything:           docker compose up --build
# Only database and cache:    docker compose up postgres redis
# Only the local call server: docker compose up livekit

services:
  livekit:
    image: livekit/livekit-server:latest   # local call server; production uses LiveKit Cloud (Mumbai)
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      # Same key and secret as in .env, so the agent and web page can connect
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"          # web and API
      - "7881:7881"          # media over TCP
      - "7882:7882/udp"      # media over UDP
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL with the pgvector add-on
    environment:
      POSTGRES_USER: vaani
      POSTGRES_PASSWORD: vaani_local_only  # local machine only, never used in production
      POSTGRES_DB: vaani
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaani -d vaani"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      # Point the agent at the local database and cache, overriding .env
      DATABASE_URL: postgresql://vaani:vaani_local_only@postgres:5432/vaani
      REDIS_URL: redis://redis:6379/0
      LIVEKIT_URL: ws://livekit:7880
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Timing and cost logs land in storage/telemetry on this machine (ignored by git)
      - ./storage/telemetry:/app/storage/telemetry
    restart: unless-stopped

  web:
    build:
      context: ./web
    env_file: web/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
