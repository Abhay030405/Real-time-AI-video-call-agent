[project]
name = "vaani-agent"
version = "0.0.1"
description = "Vaani voice companion: the LiveKit agent"
requires-python = ">=3.12"
# Runtime packages are added with the features that need them (Phase 1, steps 2 and 3).
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# ".." is the repository root (so `evals.runner` imports); "." is agent/ (so `settings` imports).
pythonpath = ["..", "."]
testpaths = ["tests", "../evals/runner/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [".", ".."]
explicit_package_bases = true
